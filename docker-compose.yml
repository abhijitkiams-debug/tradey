# One service runs the desk: the paper book and (if live_enabled) the live book, each with its
# own database and capital, inside the same /data volume. Secrets come from .env (not committed).
services:
  desk:
    build: .
    env_file: [.env]
    volumes:
      - ./config/claudetrade.toml:/config/claudetrade.toml:ro
      - desk-data:/data
    ports: ["127.0.0.1:8000:8000"]   # keep it on localhost; reach it over SSH/VPN, never expose publicly
    restart: unless-stopped

volumes:
  desk-data:
