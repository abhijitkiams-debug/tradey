# ClaudeTrade settings. Limits here are proposals: they take effect for live orders only
# after the operator approves them in the dashboard (approval is bound to their hash, so
# editing this file requires re-approval). Live trading additionally needs a runtime
# authorisation that is never restored after a restart.

# `claudetrade serve` runs the desk: a PAPER book (virtual money, live Groww prices) and,
# if live_enabled, a LIVE book (your Groww account), each with its own database and capital.
# Each strategy is switched OFF / PAPER / LIVE from the dashboard.
data_source = "groww"     # groww: live quotes + candles from Groww (paper fills use them) | none
paper_db_path = "var/paper.db"
live_db_path = "var/live.db"
live_enabled = false      # true: build the live book (needs Groww credentials). Strategies still start OFF.
tick_seconds = 15
agent_daily_review = false  # true: Claude reviews after close and may file swing proposals
research_on_start = true    # first start: fetch history and freeze strategy versions right away
# Families switched to PAPER automatically as soon as a version exists (paper only; never LIVE).
# A running version is never replaced by newer research, so its 72-hour clock keeps going.
auto_paper = ["ORB", "VWAP_PULLBACK", "MEAN_REVERSION"]

# Liquid NSE large caps well under the ₹1,000 order cap, so a position can be more than 1-2 shares.
universe = ["ITC", "COALINDIA", "NTPC", "POWERGRID", "ONGC", "TATASTEEL"]
default_avg_daily_volume = 5000000   # used by the liquidity filter until per-symbol values are set

[avg_daily_volume]
# ITC = 15000000

[external_holdings]
# Delivery shares you hold outside ClaudeTrade, excluded from reconciliation:
# ITC = 25

[risk]                     # Operator decisions, 2026-10-22 (PRD §13 / §18 Q1)
version = "pilot-2026-10-22"
starting_capital = 10000
risk_per_trade = 100       # ₹ at risk per trade (entry - stop) x qty
max_daily_loss = 300       # realised + unrealised; new entries stop for the day
max_order_value = 1000     # ₹ per order
max_position_value = 1000  # = order cap: no adding to a position beyond ₹1,000
max_portfolio_exposure = 3000  # 3 positions x ₹1,000
max_concurrent_positions = 3
max_spread_bps = 15
max_gap_pct = 5
max_quote_age_intraday_s = 10
max_quote_age_swing_s = 120
swing_proposal_ttl_minutes = 240
swing_material_change_pct = 1.5

[session]                  # PRD §18 Q6 — confirm against Groww's MIS auto square-off time
no_new_entries_after = "14:45"
square_off_start = "15:00"
square_off_deadline = "15:10"
holidays = []              # NSE trading holidays, ISO dates from the NSE holiday calendar, e.g. "2026-11-24"

[research]
history_days = 120
train_days = 40
test_days = 10
cache_dir = "var/history"

[live_gate]                # Operator decision 2026-10-22: 72 hours of paper trading before live
min_paper_hours = 72
min_clean_sessions = 3     # and the last 3 paper sessions must be clean (flat on time, reconciled, no job failures)
# paper_evidence_db defaults to paper_db_path above (same service)
require_alert_channel = true

[eligibility]              # PRD §18 Q4 — live-pilot qualification thresholds
min_oos_trades = 30
min_oos_profit_factor = 1.2
max_oos_drawdown_pct = 10.0
min_positive_fold_ratio = 0.6
